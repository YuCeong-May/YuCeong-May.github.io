      "title": "Conference Papers"
    }
  },
  "teaser": null,
  "breadcrumbs": false,
  "words_per_minute": 160,
  "future": true,
  "read_more": "disabled",
  "talkmap_link": false,
  "comments": {
    "provider": null,
    "disqus": {
      "shortname": null
    },
    "discourse": {
      "server": null
    },
    "facebook": {
      "appid": null,
      "num_posts": null,
      "colorscheme": null
    }
  },
  "staticman": {
    "allowedFields": [
      "name",
      "email",
      "url",
      "message"
    ],
    "branch": "gh-pages",
    "commitMessage": "New comment.",
    "filename": "comment-{@timestamp}",
    "format": "yml",
    "moderation": true,
    "path": "_data/comments/{options.slug}",
    "requiredFields": [
      "name",
      "email",
      "message"
    ],
    "transforms": {
      "email": "md5"
    },
    "generatedFields": {
      "date": {
        "type": "date",
        "options": {
          "format": "iso8601"
        }
      }
    }
  },
  "atom_feed": {
    "hide": true,
    "path": null
  },
  "google_site_verification": null,
  "bing_site_verification": null,
  "alexa_site_verification": null,
  "yandex_site_verification": null,
  "twitter": {
    "username": null
  },
  "facebook": {
    "username": null,
    "app_id": null,
    "publisher": null
  },
  "og_image": "monogram.svg",
  "og_description": null,
  "social": {
    "type": null,
    "name": null,
    "links": null
  },
  "analytics": {
    "provider": "false",
    "google": {
      "tracking_id": null
    }
  },
  "include": [
    "_pages",
    "files"
  ],
  "exclude": [
    "*.sublime-project",
    "*.sublime-workspace",
    ".asset-cache",
    ".bundle",
    ".github",
    ".jekyll-assets-cache",
    ".sass-cache",
    "assets/js/_main.js",
    "assets/js/plugins",
    "assets/js/vendor",
    "CHANGELOG",
    "Capfile",
    "config",
    "Dockerfile",
    "Gemfile",
    "Gruntfile.js",
    "gulpfile.js",
    "LICENSE",
    "local",
    "log",
    "node_modules",
    "package.json*",
    "Rakefile",
    "README",
    "tmp",
    "vendor",
    "AGENTS.md",
    "scripts",
    "markdown_generator",
    "talkmap",
    "talkmap.py",
    "talkmap.ipynb",
    "talkmap_out.ipynb",
    "docker-compose.yaml",
    "_drafts",
    "_posts",
    "_publications",
    "_portfolio",
    "_talks",
    "_teaching"
  ],
  "keep_files": [
    ".git",
    ".svn"
  ],
  "encoding": "utf-8",
  "markdown_ext": "markdown,mkdown,mkdn,mkd,md",
  "markdown": "kramdown",
  "highlighter": "rouge",
  "lsi": false,
  "excerpt_separator": "\n\n",
  "incremental": false,
  "kramdown": {
    "input": "GFM",
    "hard_wrap": false,
    "auto_ids": true,
    "footnote_nr": 1,
    "entity_output": "as_char",
    "toc_levels": "1..6",
    "smart_quotes": "lsquo,rsquo,ldquo,rdquo",
    "enable_coderay": false
  },
  "collections": {},
  "defaults": [
    {
      "scope": {
        "path": "",
        "type": "posts"
      },
      "values": {
        "layout": "single",
        "author_profile": true,
        "read_time": true,
        "comments": true,
        "share": true,
        "related": true
      }
    },
    {
      "scope": {
        "path": "",
        "type": "pages"
      },
      "values": {
        "layout": "single",
        "author_profile": true
      }
    },
    {
      "scope": {
        "path": "",
        "type": "teaching"
      },
      "values": {
        "layout": "single",
        "author_profile": true,
        "share": true,
        "comments": true
      }
    },
    {
      "scope": {
        "path": "",
        "type": "publications"
      },
      "values": {
        "layout": "single",
        "author_profile": true,
        "share": true,
        "comments": true
      }
    },
    {
      "scope": {
        "path": "",
        "type": "portfolio"
      },
      "values": {
        "layout": "single",
        "author_profile": true,
        "share": true,
        "comment": true
      }
    },
    {
      "scope": {
        "path": "",
        "type": "talks"
      },
      "values": {
        "layout": "talk",
        "author_profile": true,
        "share": true
      }
    }
  ],
  "sass": {
    "sass_dir": "_sass",
    "style": "compressed"
  },
  "permalink": "/:categories/:title/",
  "timezone": "Asia/Shanghai",
  "plugins": [
    "jekyll-feed",
    "jekyll-gist",
    "jekyll-paginate",
    "jekyll-sitemap",
    "jekyll-redirect-from",
    "jemoji"
  ],
  "whitelist": [
    "jekyll-feed",
    "jekyll-gist",
    "jekyll-paginate",
    "jekyll-sitemap",
    "jekyll-redirect-from",
    "jemoji"
  ],
  "category_archive": {
    "type": "liquid",
    "path": "/categories/"
  },
  "tag_archive": {
    "type": "liquid",
    "path": "/tags/"
  },
  "compress_html": {
    "clippings": "all",
    "ignore": {
      "envs": "development"
    }
  }
}